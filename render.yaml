services:
  - type: web
    name: delhi-air-pollution-forecast
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python ml/generate_training_data.py && python ml/train_model.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
